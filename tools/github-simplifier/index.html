<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GitHub Simplifier — understand GitHub repositories without digging through the whole codebase.">
  <meta name="theme-color" content="#050607">
  <title>GitHub Simplifier | BBFRAXY</title>
  <link rel="canonical" href="https://bbfraxy.com/tools/github-simplifier/">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <style>
    .simplifier-page { width: min(100%, 980px); margin: 0 auto; padding: 86px 0 64px; }
    .simplifier-card { width: min(100%, 760px); margin: 0 auto; padding: clamp(26px, 5vw, 42px); border: 1px solid var(--border); border-radius: var(--radius); background: radial-gradient(circle at 50% 0%, rgba(95,231,255,.08), transparent 42%), linear-gradient(180deg, rgba(255,255,255,.045), transparent 46%), var(--surface); box-shadow: 0 22px 70px var(--shadow), 0 0 50px rgba(95,231,255,.055); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); text-align: center; animation: card-enter 520ms ease both; }
    .simplifier-card h1 { margin: 0; color: var(--text); font-size: clamp(2.25rem, 6vw, 3.4rem); line-height: 1.02; font-weight: 820; letter-spacing: -.04em; }
    .simplifier-form { display: flex; align-items: stretch; gap: 10px; margin-top: 32px; }
    .simplifier-input { min-width: 0; flex: 1; height: 50px; border: 1px solid var(--border); border-radius: var(--radius); outline: none; padding: 0 16px; color: var(--text); background: rgba(255,255,255,.035); font: inherit; font-size: .94rem; transition: border-color 160ms ease, background 160ms ease, box-shadow 160ms ease; }
    .simplifier-input::placeholder { color: var(--faint); }
    .simplifier-input:focus { border-color: var(--border-strong); background: rgba(95,231,255,.045); box-shadow: 0 0 24px var(--glow); }
    .simplifier-submit { flex: 0 0 auto; height: 50px; border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 0 20px; color: #031014; background: var(--accent); box-shadow: 0 0 22px var(--glow); font: inherit; font-size: .9rem; font-weight: 750; cursor: pointer; transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease; }
    .simplifier-submit:hover:not(:disabled), .simplifier-submit:focus-visible:not(:disabled) { background: var(--accent-strong); box-shadow: 0 0 28px var(--glow); transform: translateY(-1px); }
    .simplifier-submit:disabled { cursor: wait; opacity: .7; }
    .simplifier-description { max-width: 610px; margin: 24px auto 0; color: var(--muted); font-size: .94rem; line-height: 1.7; }
    .simplifier-description strong { color: var(--text); font-weight: 650; }
    .simplifier-note { margin: 14px 0 0; color: var(--faint); font-size: .78rem; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .analysis-result { width: min(100%, 900px); margin: 20px auto 0; display: grid; gap: 14px; animation: card-enter 420ms ease both; }
    .analysis-head, .analysis-panel { border: 1px solid var(--border); border-radius: var(--radius); background: linear-gradient(180deg, rgba(255,255,255,.04), transparent 52%), var(--surface); box-shadow: 0 16px 50px var(--shadow); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
    .analysis-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px; }
    .analysis-kicker, .analysis-label { margin: 0 0 7px; color: var(--faint); font-size: .7rem; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    .analysis-head h2 { margin: 0; color: var(--text); font-size: 1.55rem; }
    .analysis-owner { margin: 5px 0 0; color: var(--muted); font-size: .82rem; }
    .analysis-github, .preview-github { display: inline-flex; min-height: 38px; align-items: center; border: 1px solid var(--border); border-radius: var(--radius); padding: 0 13px; color: var(--text); background: rgba(255,255,255,.035); font-size: .8rem; font-weight: 700; white-space: nowrap; }
    .analysis-github:hover, .preview-github:hover { border-color: var(--border-strong); color: var(--accent-strong); }
    .analysis-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; }
    .analysis-panel { padding: 22px; }
    .analysis-summary strong { display: block; color: var(--accent-strong); font-size: 1.05rem; }
    .analysis-summary p { margin: 9px 0 0; color: var(--muted); line-height: 1.65; font-size: .9rem; }
    .analysis-stats { display: grid; gap: 8px; color: var(--muted); font-size: .82rem; }
    .analysis-stats b { color: var(--text); margin-right: 5px; }
    .analysis-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
    .analysis-tags span, .analysis-count { display: inline-flex; min-height: 25px; align-items: center; border: 1px solid var(--border); border-radius: 999px; padding: 0 9px; color: var(--muted); background: rgba(255,255,255,.03); font-size: .7rem; }
    .analysis-panel-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 15px; }
    .analysis-panel-heading h3 { margin: 0; color: var(--text); font-size: 1.05rem; }
    .important-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .important-file { display: flex; min-width: 0; align-items: center; gap: 10px; width: 100%; min-height: 62px; border: 1px solid transparent; border-radius: calc(var(--radius) - 3px); padding: 10px 12px; color: var(--muted); background: rgba(255,255,255,.025); text-align: left; cursor: pointer; transition: border-color 160ms ease, background 160ms ease, transform 160ms ease; }
    .important-file:hover, .important-file:focus-visible { border-color: var(--border); background: rgba(95,231,255,.045); transform: translateY(-1px); outline: none; }
    .important-file-icon { flex: 0 0 auto; color: var(--accent); }
    .important-file-main { min-width: 0; flex: 1; display: grid; gap: 4px; }
    .important-file-main b { overflow: hidden; color: var(--text); text-overflow: ellipsis; white-space: nowrap; font-size: .78rem; }
    .important-file-main small { color: var(--faint); font-size: .67rem; line-height: 1.35; }
    .editability-pill { flex: 0 0 auto; border-radius: 999px; padding: 4px 7px; font-size: .62rem; white-space: nowrap; }
    .edit-safe { color: #8de9bd; background: rgba(75,210,135,.08); border: 1px solid rgba(75,210,135,.2); }
    .edit-caution { color: #e7d48b; background: rgba(220,190,70,.08); border: 1px solid rgba(220,190,70,.18); }
    .edit-core { color: #ff9f9f; background: rgba(255,80,80,.07); border: 1px solid rgba(255,80,80,.18); }
    .edit-unknown { color: var(--faint); background: rgba(255,255,255,.035); border: 1px solid var(--border); }
    .tree-browser { display: grid; gap: 2px; max-height: 540px; overflow: auto; padding-right: 4px; }
    .tree-folder { border-radius: 9px; }
    .tree-folder[open] > .folder-row .tree-chevron { transform: rotate(90deg); }
    .tree-row { display: flex; min-width: 0; align-items: center; width: 100%; min-height: 36px; gap: 8px; border: 1px solid transparent; border-radius: 8px; padding: 0 9px; color: var(--muted); background: rgba(255,255,255,.018); font: inherit; font-size: .78rem; text-align: left; }
    .folder-row { cursor: pointer; list-style: none; }
    .folder-row::-webkit-details-marker { display: none; }
    .folder-row:hover, .file-row:hover, .file-row:focus-visible { border-color: var(--border); background: rgba(95,231,255,.04); color: var(--text); outline: none; }
    .tree-chevron { width: 12px; color: var(--faint); transition: transform 140ms ease; }
    .tree-icon { width: 14px; color: var(--accent); }
    .tree-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-kind { margin-left: auto; color: var(--faint); font-size: .64rem; white-space: nowrap; }
    .tree-children { display: grid; gap: 2px; margin-left: 18px; padding-left: 8px; border-left: 1px solid rgba(255,255,255,.07); }
    .file-row { cursor: pointer; }
    .tree-spacer { width: 12px; flex: 0 0 12px; }
    .file-preview-panel[hidden] { display: none; }
    .preview-actions { display: flex; align-items: center; gap: 8px; }
    .editability-card { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; border: 1px solid var(--border); border-radius: calc(var(--radius) - 3px); padding: 12px 14px; background: rgba(255,255,255,.025); }
    .editability-card b { color: var(--text); font-size: .78rem; }
    .editability-card p { margin: 3px 0 0; color: var(--faint); font-size: .72rem; line-height: 1.5; }
    .editability-dot { width: 9px; height: 9px; margin-top: 5px; flex: 0 0 auto; border-radius: 50%; }
    .editability-dot.edit-safe { background: #64d99c; box-shadow: 0 0 10px rgba(75,210,135,.35); }
    .editability-dot.edit-caution { background: #d6bd55; box-shadow: 0 0 10px rgba(220,190,70,.28); }
    .editability-dot.edit-core { background: #ff7777; box-shadow: 0 0 10px rgba(255,80,80,.28); }
    .editability-dot.edit-unknown { background: #75808b; }
    .code-preview { overflow: auto; border: 1px solid rgba(255,255,255,.07); border-radius: calc(var(--radius) - 3px); background: #05080a; }
    .code-preview pre { margin: 0; padding: 18px; color: #d8e4e8; font: .72rem/1.65 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; tab-size: 2; white-space: pre; }
    .preview-meta { padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,.07); color: var(--faint); font-size: .66rem; }
    .preview-loading, .preview-empty { padding: 28px 18px; color: var(--faint); text-align: center; font-size: .78rem; }
    .analysis-empty, .analysis-disclaimer { color: var(--faint); font-size: .8rem; }
    .analysis-message { width: min(100%, 760px); margin: 16px auto 0; border: 1px solid rgba(255,120,120,.25); border-radius: var(--radius); padding: 13px 16px; color: #ffbcbc; background: rgba(255,80,80,.06); text-align: center; font-size: .82rem; }
    .analysis-disclaimer { margin: 2px 8px 0; text-align: center; line-height: 1.6; }
    @media (max-width: 720px) { .simplifier-page { padding: 52px 0 40px; } .analysis-grid { grid-template-columns: 1fr; } .analysis-head { align-items: flex-start; flex-direction: column; } .important-list { grid-template-columns: 1fr; } }
    @media (max-width: 620px) { .simplifier-form { flex-direction: column; } .simplifier-submit { width: 100%; } .analysis-panel { padding: 17px; } .analysis-panel-heading { align-items: flex-start; flex-direction: column; gap: 8px; } .tree-browser { max-height: 460px; } .editability-pill { display: none; } }
  </style>
</head>
<body>
  <canvas class="ambient-canvas" id="ambient-canvas" aria-hidden="true"></canvas>
  <div class="site-shell">
    <header class="site-header">
      <nav class="navbar" aria-label="Primary navigation">
        <a class="brand" href="/" aria-label="BBFRAXY home"><span class="brand-mark" aria-hidden="true">B</span><span>BBFRAXY</span></a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open navigation"><span></span><span></span><span></span></button>
        <div class="nav-menu" id="site-menu">
          <div class="nav-links" aria-label="Site sections"><a href="/games">Games</a><a href="/tools" aria-current="page">Tools</a><a href="/projects">Projects</a><a href="/downloads">Downloads</a></div>

            <a class="icon-button" href="https://github.com/FraXyprojects" target="_blank" rel="noreferrer" aria-label="GitHub"><svg viewBox="0 0 24 24" role="img" aria-hidden="true"><path d="M12 .7a11.3 11.3 0 0 0-3.6 22c.6.1.8-.2.8-.6v-2.1c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 .1.6 2.5 3.3 1.8.1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.6 0-1.2.4-2.2 1.2-3-.1-.3-.5-1.5.1-3 0 0 1-.3 3.1 1.2a10.7 10.7 0 0 1 5.6 0c2.1-1.5 3.1-1.2 3.1-1.2.6 1.5.2 2.7.1 3 .7.8 1.2 1.8 1.2 3 0 4.4-2.7 5.3-5.3 5.6.4.3.8 1 .8 2.1v3.1c0 .4.2.7.8.6A11.3 11.3 0 0 0 12 .7Z"/></svg></a>
            <button class="icon-button theme-toggle" type="button" aria-label="Switch theme" aria-pressed="false"><span class="theme-icon" aria-hidden="true"></span></button>
          </div>
        </div>
      </nav>
    </header>
    <main class="simplifier-page" id="main">
      <section class="simplifier-card" aria-labelledby="simplifier-title">
        <h1 id="simplifier-title">GitHub Simplifier</h1>
        <form class="simplifier-form">
          <label class="sr-only" for="repository-url">GitHub repository URL</label>
          <input class="simplifier-input" id="repository-url" name="repository-url" type="url" autocomplete="url" spellcheck="false" placeholder="https://github.com/owner/repository" aria-describedby="simplifier-description">
          <button class="simplifier-submit" type="submit">Analyze</button>
        </form>
        <p class="simplifier-description" id="simplifier-description">Paste a public GitHub repository and <strong>GitHub Simplifier</strong> will turn its codebase into a clear overview — what the project does, how it is structured, which parts matter and what you can safely edit.</p>
        <p class="simplifier-note">Public repositories only for now.</p>
      </section>
    </main>
    <footer class="site-footer"><span>BBFRAXY</span></footer>
  </div>
  <script src="../../assets/js/main.js" defer></script>
  <script src="./analyzer.js" defer></script>
</body>
</html>
