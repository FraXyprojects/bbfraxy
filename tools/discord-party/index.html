<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BBFRAXY tools — Discord Party Planner">
  <meta name="theme-color" content="#050607">
  <title data-i18n="tools.discordParty.title">Discord Party Planner | BBFRAXY</title>
  <link rel="canonical" href="https://bbfraxy.com/tools/discord-party/">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <style>
    .dp-page { width: min(100%, 720px); margin: 0 auto; padding: 72px 0 52px; }
    .dp-hero { margin-bottom: 28px; animation: card-enter 520ms ease both; }
    .dp-hero h1 { margin: 0; color: var(--text); font-size: clamp(2.3rem, 5vw, 3.4rem); line-height: 1; font-weight: 820; letter-spacing: -.035em; }
    .dp-hero p { max-width: 580px; margin: 12px 0 0; color: var(--muted); font-size: 1.05rem; line-height: 1.65; }

    .dp-card { padding: 28px; border: 1px solid var(--border); border-radius: var(--radius); background: linear-gradient(180deg, rgba(255,255,255,.04), transparent 48%), var(--surface); box-shadow: 0 18px 54px var(--shadow), 0 0 34px rgba(95,231,255,.03); animation: card-enter 520ms ease 90ms both; backdrop-filter: blur(18px); }

    .dp-form { display: grid; gap: 20px; }
    .dp-field { display: flex; flex-direction: column; gap: 8px; }
    .dp-label { color: var(--muted); font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }

    .dp-input, .dp-select, .dp-textarea { box-sizing: border-box; width: 100%; border: 1px solid var(--border); border-radius: 10px; background: rgba(255,255,255,.035); color: var(--text); padding: 12px 14px; font: inherit; font-size: .95rem; outline: none; transition: border-color 160ms ease, box-shadow 160ms ease; }
    .dp-input:focus, .dp-select:focus, .dp-textarea:focus { border-color: var(--border-strong); box-shadow: 0 0 0 3px rgba(95,231,255,.08); }
    .dp-textarea { min-height: 100px; resize: vertical; }

    .dp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .dp-actions { display: flex; align-items: center; justify-content: flex-end; gap: 14px; margin-top: 10px; padding-top: 20px; border-top: 1px solid var(--border); }
    .dp-button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 0 20px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--accent); color: #031014; font: inherit; font-size: .9rem; font-weight: 800; cursor: pointer; transition: opacity 160ms ease; }
    .dp-button:hover { opacity: .9; }

    .dp-output-section { margin-top: 32px; padding: 24px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-strong); display: none; }
    .dp-output-section.is-visible { display: block; animation: card-enter 300ms ease both; }
    .dp-output-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .dp-output-heading h2 { margin: 0; color: var(--text); font-size: 1.1rem; font-weight: 700; }

    .dp-copy-btn { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); padding: 6px 12px; font-size: .8rem; font-weight: 600; cursor: pointer; transition: all 160ms ease; }
    .dp-copy-btn:hover { color: var(--text); border-color: var(--border-strong); }
    .dp-copy-btn.copied { background: var(--accent); color: #031014; border-color: var(--accent); }

    .dp-pre { margin: 0; padding: 16px; border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,.3); color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: .85rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; overflow-x: auto; }

    .dp-vote-btn { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--accent); padding: 4px 8px; font-size: .75rem; font-weight: 700; cursor: pointer; transition: all 160ms ease; }
    .dp-vote-btn:hover { background: var(--accent); color: #031014; }
    .dp-vote-btn.active { background: var(--accent); color: #031014; }

    /* Discord Preview */
    .discord-preview { margin: 0; padding: 16px; border-radius: 8px; background: #313338; color: #dbdee1; font-family: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 1rem; line-height: 1.375rem; display: flex; gap: 16px; white-space: normal; }
    .discord-avatar { width: 40px; height: 40px; border-radius: 50%; background: #5865F2; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
    .discord-content { flex: 1; }
    .discord-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .discord-name { color: #f2f3f5; font-weight: 500; font-size: 1rem; }
    .discord-time { color: #949ba4; font-size: 0.75rem; }
    .discord-text { color: #dbdee1; white-space: pre-wrap; word-wrap: break-word; }
    .discord-text strong { color: #f2f3f5; font-weight: 700; }
    .discord-text a { color: #00a8fc; text-decoration: none; }
    .discord-text a:hover { text-decoration: underline; }

    /* Modal */
    .dp-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 200ms ease; }
    .dp-modal-overlay.is-visible { display: flex; opacity: 1; }
    .dp-modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 480px; padding: 24px; box-shadow: 0 24px 64px rgba(0,0,0,0.5); transform: translateY(20px); transition: transform 200ms ease; max-height: 90vh; overflow-y: auto; }
    .dp-modal-overlay.is-visible .dp-modal { transform: translateY(0); }
    .dp-modal-header { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; color: var(--text); }
    .dp-modal-options { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
    .dp-modal-option { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .dp-modal-option-inputs { display: flex; gap: 12px; flex: 1; min-width: 0; flex-wrap: wrap; }
    .dp-modal-option-inputs > * { flex: 1; min-width: 120px; }
    .dp-modal-option-remove { background: #ff4a4a; color: white; border: none; border-radius: 6px; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; font-size: 1.2rem; transition: background 160ms ease; }
    .dp-modal-option-remove:hover { background: #ff2a2a; }
    .dp-modal-add { display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px; border: 1px dashed var(--border); border-radius: 8px; background: transparent; color: var(--text); font-weight: 600; cursor: pointer; margin-bottom: 24px; transition: border-color 160ms ease; width: 100%; }
    .dp-modal-add:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 640px) {
      .dp-page { padding: 52px 0; }
      .dp-row { grid-template-columns: 1fr; gap: 20px; }
      .dp-actions { flex-direction: column; }
      .dp-button { width: 100%; }
    }
  </style>
</head>
<body>
  <canvas class="ambient-canvas" id="ambient-canvas" aria-hidden="true"></canvas>
  <div class="site-shell">
    <header class="site-header"></header>
    <main class="dp-page" id="main">
      <section class="dp-hero">
        <h1 data-i18n="tools.discordParty.heading">Discord Party Planner</h1>
        <p data-i18n="tools.discordParty.description">Naplánuj další party na Discordu. Vyber si hru, čas a vygeneruj zprávu, kterou jen zkopíruješ.</p>
      </section>

      <section class="dp-card" aria-label="Discord Party form">
        <form class="dp-form" id="dp-form">
          <div class="dp-field">
            <label class="dp-label" for="dp-title" data-i18n="tools.discordParty.eventName">Název události (volitelné)</label>
            <input class="dp-input" type="text" id="dp-title" placeholder="např. Páteční chlastačka" data-i18n-attr="placeholder:tools.discordParty.eventNamePlaceholder">
          </div>

          <div class="dp-row">
            <div class="dp-field">
              <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <label class="dp-label" for="dp-date" data-i18n="tools.discordParty.date">Datum</label>
                <button type="button" class="dp-vote-btn" id="dp-vote-date-btn" data-i18n="tools.discordParty.voteBtn">Hlasovat</button>
              </div>
              <input class="dp-input" type="date" id="dp-date" required>
              <input type="hidden" id="dp-vote-data-hidden" value="">
            </div>
            <div class="dp-field">
              <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <label class="dp-label" for="dp-time" data-i18n="tools.discordParty.time">Čas</label>
                <button type="button" class="dp-vote-btn" id="dp-vote-time-btn" data-i18n="tools.discordParty.voteBtn">Hlasovat</button>
              </div>
              <input class="dp-input" type="time" id="dp-time" value="20:00" required>
            </div>
          </div>

          <div class="dp-field">
            <label class="dp-label" for="dp-place" data-i18n="tools.discordParty.place">Místo / Voice kanál (volitelné)</label>
            <input class="dp-input" type="text" id="dp-place" placeholder="např. Hospůdka nebo https://discord.gg/..." data-i18n-attr="placeholder:tools.discordParty.placePlaceholder">
          </div>

          <div class="dp-field">
            <label class="dp-label" for="dp-game" data-i18n="tools.discordParty.game">Hra / Aktivita</label>
            <select class="dp-select" id="dp-game" required>
              <option value="" disabled selected data-i18n="tools.discordParty.gamePlaceholder">-- Vyber hru --</option>
              <option value="Gartic Phone">Gartic Phone</option>
              <option value="Riskuj (vlastní kvíz)">Riskuj (vlastní kvíz)</option>
              <option value="Hospodský Kvíz">Hospodský Kvíz</option>
              <option value="Jackbox Games">Jackbox Games</option>
              <option value="Minecraft">Minecraft</option>
              <option value="Codenames (Krycí jména)">Codenames (Krycí jména)</option>
              <option value="GeoGuessr">GeoGuessr</option>
              <option value="Kahoot">Kahoot</option>
              <option value="Watchparty (Film / Seriál)">Watchparty (Film / Seriál)</option>
              <option value="Watchparty (Sport)">Watchparty (Sport)</option>
            </select>
          </div>

          <div class="dp-field">
            <label class="dp-label" for="dp-notes" data-i18n="tools.discordParty.notes">Poznámka (volitelné)</label>
            <textarea class="dp-textarea" id="dp-notes" placeholder="Připravte se na zapeklité otázky!" data-i18n-attr="placeholder:tools.discordParty.notesPlaceholder"></textarea>
          </div>

          <div class="dp-actions">
            <button class="dp-button" type="submit" id="dp-generate" data-i18n="tools.discordParty.generateBtn">Vygenerovat pro Discord →</button>
          </div>
        </form>
      </section>

      <section class="dp-output-section" id="dp-output-section" aria-live="polite">
        <div class="dp-output-heading">
          <h2 data-i18n="tools.discordParty.outputHeading">Vygenerovaná zpráva</h2>
          <button class="dp-copy-btn" type="button" id="dp-copy-btn" data-i18n="tools.discordParty.copyBtn">Kopírovat kód pro Discord</button>
        </div>

        <div class="discord-preview" aria-hidden="true">
          <div class="discord-avatar">BB</div>
          <div class="discord-content">
            <div class="discord-header">
              <span class="discord-name" data-i18n="tools.discordParty.discordPreviewName">Ty</span>
              <span class="discord-time">Dnes v 12:00</span>
            </div>
            <div class="discord-text" id="dp-preview-text"></div>
          </div>
        </div>

        <pre class="dp-pre" id="dp-output" style="display: none;"></pre>
      </section>
    </main>
    <footer class="site-footer"><span data-i18n="footer.text">BBFRAXY</span></footer>
  </div>

  <!-- Modal -->
  <div class="dp-modal-overlay" id="dp-vote-modal">
    <div class="dp-modal">
      <div class="dp-modal-header" data-i18n="tools.discordParty.modalTitle">Hlasování o termínu</div>

      <div class="dp-field" style="margin-bottom: 20px;">
        <label class="dp-label" data-i18n="tools.discordParty.modalTypeLabel">Typ hlasování</label>
        <select class="dp-select" id="dp-modal-type">
          <option value="dates" data-i18n="tools.discordParty.modalTypeDates">Jen dny</option>
          <option value="times" data-i18n="tools.discordParty.modalTypeTimes">Jen časy</option>
          <option value="combined" data-i18n="tools.discordParty.modalTypeCombined">Konkrétní termíny (Den + Čas)</option>
        </select>
      </div>

      <div class="dp-modal-options" id="dp-modal-options">
        <!-- JS will inject options here -->
      </div>

      <button type="button" class="dp-modal-add" id="dp-modal-add" data-i18n="tools.discordParty.modalAddBtn">+ Přidat možnost</button>

      <div class="dp-actions" style="border-top: none; padding-top: 0; justify-content: flex-end; width: 100%;">
        <button type="button" class="dp-copy-btn" id="dp-modal-cancel" data-i18n="tools.discordParty.modalCancelBtn">Zrušit</button>
        <button type="button" class="dp-button" id="dp-modal-save" data-i18n="tools.discordParty.modalSaveBtn">Uložit hlasování</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/i18n.js" defer></script>
  <script src="../../assets/js/header.js" defer></script>
  <script src="../../assets/js/main.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
