<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraXy´s Trivia</title>
    <link rel="stylesheet" href="./css/trivia.css">
</head>
<body>
    <h1>FraXy´s Trivia</h1>

    <div id="timer">Čas: 0s</div>

    <div id="question-container">
        <p id="question-text">
            Pro spuštění hry klikni na políčko START
        </p>

        <div id="answer-buttons" style="display: none;"></div>
    </div>

    <div id="game-board">
        <div class="square start">START</div>

        <div class="square" data-theme="math">1</div>
        <div class="square" data-theme="math">2</div>
        <div class="square" data-theme="math">3</div>
        <div class="square" data-theme="math">4</div>
        <div class="square" data-theme="math">5</div>
        <div class="square" data-theme="math">6</div>
        <div class="square" data-theme="math">7</div>
        <div class="square" data-theme="math">8</div>
        <div class="square" data-theme="math">9</div>
        <div class="square" data-theme="math">10</div>
        <div class="square" data-theme="math">11</div>
        <div class="square" data-theme="math">12</div>

        <div class="square goal">CÍL</div>
    </div>

    <div id="result">
        <p class="success">Vyhrál jsi!</p>

        <p class="details">
            Dokončil jsi kvíz s
            <span class="highlight" id="wrong-answers">0</span>
            špatnými odpověďmi.
            <br>
            <br>
            Trvalo ti to
            <span class="highlight" id="completion-time">0</span>
            sekund.
        </p>

        <div id="result-buttons">
            <button class="btn btn-download">
                Stáhnout výsledek
            </button>

            <button class="btn btn-restart">
                Restartovat
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
