<!doctype html>
<html lang="cs" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
        name="description"
        content="FRAXY Riskuj Quiz Builder — vytvoření a úprava vlastních kvízů."
    >
    <title>BBFRAXY | Riskuj Quiz Builder</title>

    <link rel="stylesheet" href="/assets/css/styles.css">

    <style>
        main {
            width: min(100% - 32px, 1100px);
            margin: 0 auto;
            padding: 28px 0 76px;
        }

        .hero {
            display: block;
            min-height: 0;
            place-items: initial;
            padding: 22px 0 24px;
        }

        .eyebrow {
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.14em;
        }

        .eyebrow::before {
            content: '•';
            color: var(--accent);
            margin-right: 8px;
        }

        .hero h1 {
            font-size: clamp(2.2rem, 5vw, 4rem);
            margin: 8px 0 10px;
            line-height: 1.02;
            letter-spacing: -0.04em;
        }

        .hero p,
        .note {
            color: var(--muted);
            line-height: 1.65;
        }

        .panel {
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: 0 20px 60px var(--shadow);
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .toolbar-main {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar-back {
            margin-left: auto;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 9px 15px;
            border: 1px solid transparent;
            border-radius: var(--radius);
            background: var(--accent);
            color: #031014;
            font-weight: 850;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--accent-strong);
            transform: translateY(-1px);
        }

        .btn.secondary {
            background: var(--surface-strong);
            color: var(--text);
            border-color: var(--border);
        }

        .btn.danger {
            background: #632832;
            color: #fff;
        }

        .topic {
            padding: 18px;
            margin: 14px 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-soft);
        }

        .topic-head {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topic-head input {
            flex: 1;
        }

        .topic h2 {
            margin: 0;
        }

        .questions {
            margin-top: 12px;
        }

        .q {
            display: grid;
            grid-template-columns: 1.5fr 1fr 100px auto;
            gap: 8px;
            margin: 8px 0;
        }

        .input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px 11px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
        }

        .status {
            min-height: 24px;
            color: var(--accent-strong);
            font-weight: 700;
        }

        .hidden {
            display: none !important;
        }

        .empty {
            padding: 18px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
        }

        @media (max-width: 760px) {
            .q {
                grid-template-columns: 1fr;
            }

            .topic-head {
                align-items: stretch;
                flex-direction: column;
            }

            .toolbar-back {
                margin-left: 0;
                width: 100%;
            }

            .toolbar-main {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="site-shell">
        <header class="site-header">
            <nav class="navbar" aria-label="Primary navigation">
                <a class="brand" href="/" aria-label="BBFRAXY home">
                    <span class="brand-mark">F</span>
                    <span>BBFRAXY</span>
                </a>

                <button
                    class="menu-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="site-menu"
                    aria-label="Open navigation"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <div class="nav-menu" id="site-menu">
                    <div class="nav-links">
                        <a href="/games/">Games</a>
                        <a href="/tools">Tools</a>
                        <a href="/projects">Projects</a>
                        <a href="/downloads">Downloads</a>
                    </div>

                    <div class="nav-actions">
                        <a
                            class="icon-button"
                            href="https://github.com/FraXyprojects"
                            target="_blank"
                            rel="noreferrer"
                            aria-label="GitHub"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 .7a11.3 11.3 0 0 0-3.6 22c.6.1.8-.2.8-.6v-2.1c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 .1.6 2.5 3.3 1.8.1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.6 0-1.2.4-2.2 1.2-3-.1-.3-.5-1.5-.1-3 0 0 1-.3 3.1 1.2a10.7 10.7 0 0 1 5.6 0c2.1-1.5 3.1-1.2 3.1-1.2.6 1.5.2 2.7.1 3 .7.8 1.2 1.8 1.2 3 0 4.4-2.7 5.3-5.3 5.6.4.3.8 1 .8 2.1v3.1c0 .4.2.7.8.6A11.3 11.3 0 0 0 12 .7Z" />
                            </svg>
                        </a>

                        <button
                            class="icon-button theme-toggle"
                            type="button"
                            aria-label="Switch theme"
                            aria-pressed="false"
                        >
                            <span class="theme-icon"></span>
                        </button>
                    </div>
                </div>
            </nav>
        </header>

        <main>
            <section class="hero">
                <div class="eyebrow">FRAXY // QUIZ BUILDER</div>
                <h1>Vytvoř nebo uprav kvíz.</h1>
                <p>
                    Připrav si vlastní témata, otázky, odpovědi a bodové hodnoty.
                    Výsledek uložíš jako <strong>quiz.json</strong> a pak ho nahraješ do Riskuj.
                </p>
            </section>

            <section class="panel">
                <div class="toolbar">
                    <div class="toolbar-main">
                        <button class="btn" onclick="newQuiz()">＋ Nový kvíz</button>

                        <label class="btn secondary">
                            📂 Načíst JSON
                            <input
                                id="file"
                                type="file"
                                accept=".json"
                                class="hidden"
                            >
                        </label>

                        <button class="btn secondary" onclick="downloadQuiz()">
                            ↓ Stáhnout quiz.json
                        </button>
                    </div>

                    <a class="btn secondary toolbar-back" href="/games/riskuj/">
                        ← Zpět do Riskuj
                    </a>
                </div>

                <div id="status" class="status"></div>
                <div id="topics"></div>

                <div id="empty" class="empty hidden">
                    Zatím nemáš žádné téma. Začni tlačítkem
                    <strong>＋ Přidat téma</strong>.
                </div>

                <button class="btn secondary" onclick="addTopic()">
                    ＋ Přidat téma
                </button>
            </section>
        </main>

        <footer class="site-footer">
            <span>BBFRAXY</span>
        </footer>
    </div>

    <script src="/assets/js/main.js" defer></script>
    <script>
        const topicsEl = document.getElementById('topics');
        const statusEl = document.getElementById('status');
        const fileEl = document.getElementById('file');
        const emptyEl = document.getElementById('empty');

        let data = {
            topics: []
        };

        function newQuiz() {
            data = {
                topics: []
            };

            addTopic({
                name: '',
                questions: [
                    {
                        question: '',
                        answer: '',
                        value: 100
                    }
                ]
            });

            setStatus('Nový prázdný kvíz.');
        }

        function addTopic(topic = { name: '', questions: [] }) {
            data.topics.push({
                name: topic.name || '',
                questions: Array.isArray(topic.questions)
                    ? topic.questions
                    : []
            });

            render();
        }

        function addQuestion(topicIndex) {
            data.topics[topicIndex].questions.push({
                question: '',
                answer: '',
                value: (data.topics[topicIndex].questions.length + 1) * 100
            });

            render();
        }

        function removeTopic(topicIndex) {
            data.topics.splice(topicIndex, 1);
            render();
        }

        function removeQuestion(topicIndex, questionIndex) {
            data.topics[topicIndex].questions.splice(questionIndex, 1);
            render();
        }

        function render() {
            emptyEl.classList.toggle('hidden', data.topics.length > 0);

            topicsEl.innerHTML = data.topics
                .map((topic, topicIndex) => {
                    return `
                        <article class="topic">
                            <div class="topic-head">
                                <input
                                    class="input"
                                    value="${esc(topic.name)}"
                                    placeholder="Název tématu"
                                    oninput="data.topics[${topicIndex}].name=this.value"
                                >

                                <button
                                    class="btn danger"
                                    onclick="removeTopic(${topicIndex})"
                                >
                                    Smazat téma
                                </button>
                            </div>

                            <div class="questions">
                                ${topic.questions
                                    .map((question, questionIndex) => {
                                        return `
                                            <div class="q">
                                                <input
                                                    class="input"
                                                    value="${esc(question.question)}"
                                                    placeholder="Otázka"
                                                    oninput="data.topics[${topicIndex}].questions[${questionIndex}].question=this.value"
                                                >

                                                <input
                                                    class="input"
                                                    value="${esc(question.answer)}"
                                                    placeholder="Odpověď"
                                                    oninput="data.topics[${topicIndex}].questions[${questionIndex}].answer=this.value"
                                                >

                                                <input
                                                    class="input"
                                                    type="number"
                                                    min="0"
                                                    step="100"
                                                    value="${Number(question.value) || 0}"
                                                    oninput="data.topics[${topicIndex}].questions[${questionIndex}].value=Number(this.value)"
                                                >

                                                <button
                                                    class="btn danger"
                                                    onclick="removeQuestion(${topicIndex},${questionIndex})"
                                                >
                                                    ×
                                                </button>
                                            </div>
                                        `;
                                    })
                                    .join('')}
                            </div>

                            <button
                                class="btn secondary"
                                onclick="addQuestion(${topicIndex})"
                            >
                                ＋ Přidat otázku
                            </button>
                        </article>
                    `;
                })
                .join('');
        }

        function downloadQuiz() {
            if (!data.topics.length) {
                alert('Nejdřív přidej alespoň jedno téma.');
                return;
            }

            const blob = new Blob(
                [JSON.stringify(data, null, 2)],
                { type: 'application/json' }
            );

            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');

            anchor.href = url;
            anchor.download = 'quiz.json';
            anchor.click();

            URL.revokeObjectURL(url);
            setStatus('quiz.json byl připraven ke stažení.');
        }

        function loadFile() {
            const file = fileEl.files[0];

            if (!file) {
                return;
            }

            const reader = new FileReader();

            reader.onload = (event) => {
                try {
                    const parsed = JSON.parse(event.target.result);

                    if (!Array.isArray(parsed.topics)) {
                        throw new Error();
                    }

                    data = {
                        topics: parsed.topics.map((topic) => ({
                            name: topic.name || '',
                            questions: (topic.questions || []).map((question) => ({
                                question: question.question || '',
                                answer: question.answer || '',
                                value: Number(question.value) || 0
                            }))
                        }))
                    };

                    render();
                    setStatus(`Načteno ${data.topics.length} témat z ${file.name}.`);
                } catch {
                    alert('Soubor nemá platný Riskuj JSON.');
                }
            };

            reader.readAsText(file);
        }

        fileEl.addEventListener('change', loadFile);

        function setStatus(message) {
            statusEl.textContent = message;
        }

        function esc(value) {
            return String(value).replace(/[&<>\\"]/g, (char) => {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '\\': '&#92;',
                    '"': '&quot;'
                }[char] || char;
            });
        }

        newQuiz();

        const params = new URLSearchParams(location.search);
        if (params.get('edit') === '1') {
            setStatus('Režim úprav: načti svůj existující quiz.json.');
        }
    </script>
</body>
</html>
