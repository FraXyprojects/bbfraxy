<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vytvořit kvíz Riskuj</title><style>body{font-family:Arial,sans-serif}input{margin:4px;padding:6px}button{padding:8px 14px;margin:5px}</style></head><body><h1>Vytvořit kvíz Riskuj</h1><form id="quiz-form"><div id="topics-container"><h2>Témata</h2><button type="button" onclick="addTopic()">Přidat téma</button></div><button type="button" onclick="saveQuiz()">Uložit kvíz</button></form><script>let topicCount=0;function addTopic(){topicCount++;const c=document.getElementById('topics-container'),d=document.createElement('div');d.innerHTML=`<h3>Téma ${topicCount}</h3><input type="text" name="topic${topicCount}" placeholder="Název tématu" required><div id="questions-container-${topicCount}"><button type="button" onclick="addQuestion(${topicCount})">Přidat otázku</button></div>`;c.insertBefore(d,c.lastElementChild)}function addQuestion(n){const c=document.getElementById(`questions-container-${n}`),d=document.createElement('div');d.innerHTML=`<input type="text" name="question-${n}[]" placeholder="Otázka" required><input type="text" name="answer-${n}[]" placeholder="Odpověď" required><input type="number" name="value-${n}[]" placeholder="Hodnota" required min="100" step="100">`;c.insertBefore(d,c.lastElementChild)}function saveQuiz(){const form=document.getElementById('quiz-form'),fd=new FormData(form),data={topics:[]};for(let i=1;i<=topicCount;i++){const name=fd.get(`topic${i}`),qs=[],qi=form.querySelectorAll(`input[name="question-${i}[]"]`),ai=form.querySelectorAll(`input[name="answer-${i}[]"]`),vi=form.querySelectorAll(`input[name="value-${i}[]"]`);for(let j=0;j<qi.length;j++)qs.push({question:qi[j].value,answer:ai[j].value,value:parseInt(vi[j].value)});data.topics.push({name,questions:qs})}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='quiz.json';a.click();URL.revokeObjectURL(url)}</script></body></html>
