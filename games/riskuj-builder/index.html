<!doctype html>
<html lang="cs" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="FRAXY Riskuj Quiz Builder — vytvoření a úprava vlastních kvízů."><title>BBFRAXY | Riskuj Quiz Builder</title>
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
main{width:min(100% - 32px,1100px);margin:0 auto;padding:28px 0 76px}.hero{display:block;min-height:0;place-items:initial;padding:22px 0 24px}.eyebrow{color:var(--muted);font-size:.75rem;font-weight:800;letter-spacing:.14em}.eyebrow:before{content:'•';color:var(--accent);margin-right:8px}.hero h1{font-size:clamp(2.2rem,5vw,4rem);margin:8px 0 10px;line-height:1.02;letter-spacing:-.04em}.hero p,.note{color:var(--muted);line-height:1.65}.panel{padding:24px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:0 20px 60px var(--shadow)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 15px;border:1px solid transparent;border-radius:var(--radius);background:var(--accent);color:#031014;font-weight:850;cursor:pointer;text-decoration:none}.btn:hover{background:var(--accent-strong);transform:translateY(-1px)}.btn.secondary{background:var(--surface-strong);color:var(--text);border-color:var(--border)}.btn.danger{background:#632832;color:#fff}.topic{padding:18px;margin:14px 0;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-soft)}.topic-head{display:flex;align-items:center;gap:10px}.topic-head input{flex:1}.topic h2{margin:0}.questions{margin-top:12px}.q{display:grid;grid-template-columns:1.5fr 1fr 100px auto;gap:8px;margin:8px 0}.input{box-sizing:border-box;width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font:inherit}.status{min-height:24px;color:var(--accent-strong);font-weight:700}.hidden{display:none!important}.empty{padding:18px;border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted)}@media(max-width:760px){.q{grid-template-columns:1fr}.topic-head{align-items:stretch;flex-direction:column}}
</style>
</head>
<body><div class="site-shell"><header class="site-header"><nav class="navbar" aria-label="Primary navigation"><a class="brand" href="/" aria-label="BBFRAXY home"><span class="brand-mark">B</span><span>BBFRAXY</span></a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open navigation"><span></span><span></span><span></span></button><div class="nav-menu" id="site-menu"><div class="nav-links"><a href="/games/">Games</a><a href="/tools">Tools</a><a href="/projects">Projects</a><a href="/downloads">Downloads</a></div><div class="nav-actions"><a class="icon-button" href="https://github.com/FraXyprojects" target="_blank" rel="noreferrer" aria-label="GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.3 11.3 0 0 0-3.6 22c.6.1.8-.2.8-.6v-2.1c0-.4-.2-.7-.8-.6A11.3 11.3 0 0 0 12 .7Z"/></svg></a><button class="icon-button theme-toggle" type="button" aria-label="Switch theme" aria-pressed="false"><span class="theme-icon"></span></button></div></div></nav></header>
<main><section class="hero"><div class="eyebrow">FRAXY // QUIZ BUILDER</div><h1>Vytvoř nebo uprav kvíz.</h1><p>Připrav si vlastní témata, otázky, odpovědi a bodové hodnoty. Výsledek uložíš jako <strong>quiz.json</strong> a pak ho nahraješ do Riskuj.</p></section><section class="panel"><div class="toolbar"><button class="btn" onclick="newQuiz()">＋ Nový kvíz</button><label class="btn secondary">📂 Načíst JSON<input id="file" type="file" accept=".json" class="hidden"></label><button class="btn secondary" onclick="downloadQuiz()">↓ Stáhnout quiz.json</button><a class="btn secondary" href="/games/riskuj/">← Zpět do Riskuj</a></div><div id="status" class="status"></div><div id="topics"></div><div id="empty" class="empty hidden">Zatím nemáš žádné téma. Začni tlačítkem <strong>＋ Přidat téma</strong>.</div><button class="btn secondary" onclick="addTopic()">＋ Přidat téma</button></section></main><footer class="site-footer"><span>BBFRAXY</span></footer></div>
<script src="/assets/js/main.js" defer></script><script>
const topicsEl=document.getElementById('topics'),statusEl=document.getElementById('status'),fileEl=document.getElementById('file'),emptyEl=document.getElementById('empty');let data={topics:[]};
function newQuiz(){data={topics:[]};addTopic({name:'',questions:[{question:'',answer:'',value:100}]});setStatus('Nový prázdný kvíz.')}function addTopic(topic={name:'',questions:[]}){data.topics.push({name:topic.name||'',questions:Array.isArray(topic.questions)?topic.questions:[]});render()}function addQuestion(t){data.topics[t].questions.push({question:'',answer:'',value:(data.topics[t].questions.length+1)*100});render()}function removeTopic(t){data.topics.splice(t,1);render()}function removeQuestion(t,q){data.topics[t].questions.splice(q,1);render()}
function render(){emptyEl.classList.toggle('hidden',data.topics.length>0);topicsEl.innerHTML=data.topics.map((t,i)=>`<article class="topic"><div class="topic-head"><input class="input" value="${esc(t.name)}" placeholder="Název tématu" oninput="data.topics[${i}].name=this.value"><button class="btn danger" onclick="removeTopic(${i})">Smazat téma</button></div><div class="questions">${t.questions.map((q,j)=>`<div class="q"><input class="input" value="${esc(q.question)}" placeholder="Otázka" oninput="data.topics[${i}].questions[${j}].question=this.value"><input class="input" value="${esc(q.answer)}" placeholder="Odpověď" oninput="data.topics[${i}].questions[${j}].answer=this.value"><input class="input" type="number" min="0" step="100" value="${Number(q.value)||0}" oninput="data.topics[${i}].questions[${j}].value=Number(this.value)"><button class="btn danger" onclick="removeQuestion(${i},${j})">×</button></div>`).join('')}</div><button class="btn secondary" onclick="addQuestion(${i})">＋ Přidat otázku</button></article>`).join('')}
function downloadQuiz(){if(!data.topics.length){alert('Nejdřív přidej alespoň jedno téma.');return}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='quiz.json';a.click();URL.revokeObjectURL(url);setStatus('quiz.json byl připraven ke stažení.')}function loadFile(){const f=fileEl.files[0];if(!f)return;const r=new FileReader;r.onload=e=>{try{const parsed=JSON.parse(e.target.result);if(!Array.isArray(parsed.topics))throw Error();data={topics:parsed.topics.map(t=>({name:t.name||'',questions:(t.questions||[]).map(q=>({question:q.question||'',answer:q.answer||'',value:Number(q.value)||0}))}))};render();setStatus(`Načteno ${data.topics.length} témat z ${f.name}.`)}catch{alert('Soubor nemá platný Riskuj JSON.')}};r.readAsText(f)}fileEl.addEventListener('change',loadFile);function setStatus(s){statusEl.textContent=s}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]||c))}newQuiz();const params=new URLSearchParams(location.search);if(params.get('edit')==='1')setStatus('Režim úprav: načti svůj existující quiz.json.');
</script></body></html>
