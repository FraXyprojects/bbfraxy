<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Riskuj — rozšířené</title><style>body{font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;background:#f5f5f5}#setup,#board{display:none}table{border-collapse:collapse;margin:20px auto}th,td{border:1px solid #111;padding:10px;text-align:center}td button{width:100%;min-width:100px;padding:10px;margin:0}.selected{border:3px solid #f0f!important}.active-player{font-weight:bold;border-bottom:3px solid #111}.panel{text-align:center}#timerDisplay{font-size:24px;margin:10px}</style></head><body><h1>Riskuj — rozšířené</h1><input type="file" id="quiz-file" accept=".json"><button onclick="loadQuizFromFile()">Nahrát kvíz</button><div id="initial"><h2>Nastavení hry</h2><label>Počet témat: <input id="topic-count" type="number" min="1" max="10" value="5"></label><br><label>Počet hráčů/týmů: <input id="player-count" type="number" min="1" max="10" value="2"></label><br><label>Počet vteřin pro odpočet: <input id="timerSeconds" type="number" min="1" value="60"></label><br><button onclick="setupGame()">Nastavit hru</button></div><div id="setup"><h2>Zadej názvy témat a jména hráčů/týmů</h2><div id="topic-inputs"></div><div id="player-inputs"></div><button onclick="startGame()">Začít hru</button></div><div id="board"><table id="jeopardy-table"></table><div id="players-score"></div><div class="panel"><p id="current-question">Otázka zde</p><button onclick="answerQuestion(true)">Správně</button><button onclick="answerQuestion(false)">Špatně</button><button onclick="nextPlayer()">Vyber dalšího hráče</button><div><button onclick="startTimer()">⏳</button><div id="timerDisplay"></div></div></div></div><script>let topics=[],players=[],currentPlayer=0,questions={},timerSeconds,timerInterval;const colors=['blue','green','red','orange','purple','pink','brown','cyan','magenta','lime'];function loadQuizFromFile(){const f=document.getElementById('quiz-file').files[0];if(!f)return;const r=new FileReader;r.onload=e=>{const d=JSON.parse(e.target.result);topics=d.topics.map(t=>t.name);questions={};d.topics.forEach(t=>t.questions.forEach(q=>questions[`${t.name}-${q.value}`]=q.question));document.getElementById('topic-count').value=topics.length;document.getElementById('initial').style.display='none';document.getElementById('setup').style.display='block';playerInputs.innerHTML='';const pc=+document.getElementById('player-count').value;for(let i=0;i<pc;i++)playerInputs.innerHTML+=`<input id="player-${i}" placeholder="Hráč/Tým ${i+1}" required><br>`};r.readAsText(f)}function setupGame(){const tc=+document.getElementById('topic-count').value,pc=+document.getElementById('player-count').value;initial.style.display='none';setup.style.display='block';topicInputs.innerHTML='';playerInputs.innerHTML='';for(let i=0;i<tc;i++)topicInputs.innerHTML+=`<input id="topic-${i}" placeholder="Téma ${i+1}" required><br>`;for(let i=0;i<pc;i++)playerInputs.innerHTML+=`<input id="player-${i}" placeholder="Hráč/Tým ${i+1}" required><br>`}function startGame(){if(!topics.length)topics=[...document.querySelectorAll('#topic-inputs input')].map(x=>x.value.trim());players=[...document.querySelectorAll('#player-inputs input')].map((x,i)=>({name:x.value.trim(),score:0,color:colors[i%colors.length]}));if(topics.some(x=>!x)||players.some(x=>!x.name)){alert('Všechna pole musí být vyplněna');return}timerSeconds=+document.getElementById('timerSeconds').value;setup.style.display='none';board.style.display='block';createBoard();updateScores()}function createBoard(){jeopardy-table.innerHTML='';const h=jeopardy-table.insertRow();topics.forEach(t=>{const th=document.createElement('th');th.textContent=t;h.appendChild(th)});for(let v=100;v<=500;v+=100){const r=jeopardy-table.insertRow();topics.forEach(t=>{const c=r.insertCell(),b=document.createElement('button');b.textContent=v;b.onclick=e=>showQuestion(t,v,e);c.appendChild(b);if(!questions[`${t}-${v}`])questions[`${t}-${v}`]=`Otázka pro téma ${t} za ${v} bodů`})}}function showQuestion(t,v,e){current-question.textContent=questions[`${t}-${v}`];document.querySelectorAll('#jeopardy-table button').forEach(b=>b.classList.remove('selected'));e.target.classList.add('selected');resetTimer()}function answerQuestion(ok){const b=document.querySelector('#jeopardy-table button.selected');if(!b)return;const m=current-question.textContent.match(/za (\d+) bodů/);if(!m)return;const v=+m[1];players[currentPlayer].score+=ok?v:-v;if(ok){b.style.backgroundColor=players[currentPlayer].color;b.textContent=`${v} - ${players[currentPlayer].name}`;b.disabled=true}else b.style.backgroundColor='gray';b.classList.remove('selected');current-question.textContent='Otázka zde';resetTimer();updateScores();nextPlayer();if(document.querySelectorAll('#jeopardy-table button:disabled').length===document.querySelectorAll('#jeopardy-table button').length)finish()}function updateScores(){players-score.innerHTML=players.map((p,i)=>`<span class="${i===currentPlayer?'active-player':''}" style="color:${p.color}">${p.name}: ${p.score}</span>`).join(' | ')}function nextPlayer(){currentPlayer=(currentPlayer+1)%players.length;updateScores()}function startTimer(){resetTimer();let r=timerSeconds;timerDisplay.textContent=r;timerInterval=setInterval(()=>{timerDisplay.textContent=--r;if(r<=0)resetTimer()},1000)}function resetTimer(){clearInterval(timerInterval);timerDisplay.textContent=''}function finish(){const w=[...players].sort((a,b)=>b.score-a.score)[0];const d=document.createElement('div');d.innerHTML=`<h2>Vítězem se stává: ${w.name}</h2><p>${players.map(p=>`${p.name}: ${p.score} bodů`).join('<br>')}</p>`;board.appendChild(d)}</script></body></html>
